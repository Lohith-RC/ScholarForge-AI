{% extends "base.html" %}

{% block title %}Create Account &mdash; ScholarForge AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-slate-900 dark:bg-sky-400 text-white dark:text-slate-900 mx-auto flex items-center justify-center font-extrabold text-2xl shadow mb-3">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Create Workspace</h1>
        <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Start synthesizing grounded academic research today</p>
    </div>

    <div class="sketch-card rounded-2xl p-8 bg-white dark:bg-slate-900">
        <form method="POST" action="{{ url_for('register') }}" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Choose Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user-plus"></i></span>
                    <input type="text" id="username" name="username" required placeholder="e.g. scholar_smith"
                           class="w-full pl-10 pr-3 py-3 rounded-xl sketch-input text-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">Create Secure Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                           class="w-full pl-10 pr-3 py-3 rounded-xl sketch-input text-sm">
                </div>
            </div>

            <button type="submit" class="w-full sketch-btn-primary p-3 rounded-xl font-bold text-sm flex items-center justify-center space-x-2">
                <span>Register & Create Workspace</span>
                <i class="fa-solid fa-user-check"></i>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500">
            Already have an academic account? 
            <a href="{{ url_for('login') }}" class="font-bold text-sky-600 dark:text-sky-400 hover:underline">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
