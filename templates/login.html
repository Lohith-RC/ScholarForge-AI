{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="mb-6">
    <div class="text-center">
        <h1 class="text-3xl font-bold">Welcome back</h1>
        <p class="text-gray-600 dark:text-gray-300">Access your AI research workspace</p>
    </div>
</section>
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-gray-200 mt-6 dark:bg-gray-800 dark:border-gray-700">
    <h2 class="text-2xl font-bold text-center text-gray-800 dark:text-gray-100 mb-6">Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" id="username" name="username" required 
                   class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-900 dark:border-gray-700">
        </div>
        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-900 dark:border-gray-700">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-150">
            Login
        </button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
        Don't have an account? <a href="{{ url_for('register') }}" class="text-blue-600 hover:underline font-medium">Register here</a>
    </p>
</div>
{% endblock %}
